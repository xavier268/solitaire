# https://taskfile.dev
version: "3"

vars:
  VERSION:
    sh: go run ./cmd/version
  BENCH_FILE: bench/bench-v{{.VERSION}}.txt
  BENCH_COUNT: 10 # nombre de mesures par benchmark (benchstat exige au moins 6 pour calculer un intervalle de confiance)

tasks:
  default:
    desc: Liste les tâches disponibles
    cmds:
      - task --list
    silent: true

  build:
    desc: Compile le package et les commandes
    cmds:
      - go build ./...

  test:
    desc: Lance les tests
    cmds:
      - go test -count=1 ./...

  cover:
    desc: Lance les tests avec couverture (résumé par fonction)
    cmds:
      - go test -count=1 -coverprofile=coverage.out ./...
      - go tool cover -func=coverage.out

  cover:html:
    desc: Rapport de couverture HTML (ouvert dans le navigateur)
    deps: [cover]
    cmds:
      - go tool cover -html=coverage.out

  bench:
    desc: Lance les benchmarks, les sauve dans bench/bench-v<VERSION>.txt, puis compare toutes les versions (benchstat)
    cmds:
      - go run ./cmd/sysinfo > {{.BENCH_FILE}}
      - go test -run '^$' -bench . -benchmem -count={{.BENCH_COUNT}} ./... >> {{.BENCH_FILE}}
      - echo "Résultats (version {{.VERSION}}) sauvés dans {{.BENCH_FILE}}"
      - task: bench:stat

  bench:stat:
    desc: Compare avec benchstat tous les fichiers bench/bench-v*.txt, affiche et sauve dans bench/bench-stats.md
    cmds:
      # cmd/benchtable appelle benchstat (CSV) et produit des tableaux ASCII purs (format Markdown).
      - go run ./cmd/benchtable > bench/bench-stats.md
      - go run ./cmd/benchtable
      - echo "Comparaison sauvée dans bench/bench-stats.md"
